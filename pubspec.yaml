name: rcl_mobile
description: RCL ERP – the mobile app (Android and iPhone). Its own phone screens on the same servers; one sign-in through the Portal.
publish_to: none
version: 3.72.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3 # (3.19.0) the fingerprint (SHA-256) of the Windows update, checked before it is run
  flutter_secure_storage: ^9.2.0
  package_info_plus: ^8.0.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0
  app_links: ^6.3.2 # (3.41.0) a "Scan with Mobile" QR code scanned with the phone's camera / Google Lens opens in the app
  firebase_core: ^4.14.0 # (3.42.0) the notifications at once, also with the app closed (Firebase Cloud Messaging – core/push_fcm.dart)
  firebase_messaging: ^16.7.0
  flutter_inappwebview: 6.2.0-beta.3 # 6.1.5 (stable) no longer builds with this Flutter (its Android build file)
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  camera: ^0.12.1 # (3.29.0) the live reading of a meter / a dispenser: the app's own camera, its pictures read on the phone (ML Kit)
  geolocator: ^14.0.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.15.0 # (3.1.8) the number plate read on the phone
  sensors_plus: ^7.1.1 # (3.31.3) how the phone is held (its accelerometer): the box of the live reading turns with the phone
  mobile_scanner: ">=7.4.2 <8.0.0" # (3.18.2) the QR scanner of a machinery label: the live camera, a code read at once (ML Kit, on the phone)
  flutter_local_notifications: ^19.4.0 # (3.1.8) waiting for approval / sent back
  android_alarm_manager_plus: ">=4.0.0 <6.0.0" # (3.1.8) those notifications also with the app closed (Android)
  archive: ">=3.6.0 <5.0.0" # (3.2.0) the reports as Excel files (an .xlsx is a zip)
  qr: ^3.0.2 # (3.13.0) the QR labels of the Asset Master – the same QR maker as the web's (qrcode-generator, ported)
  file_picker: ^11.0.3 # (3.11.0) (13.x needs another win32 than share_plus 12) an Excel / CSV file to import, from the phone's files
  flutter_tts: ^4.2.5 # (3.15.0) the assistant's answer said aloud (the web's speechSynthesis)
  speech_to_text: ">=7.5.0 <8.0.0" # (3.15.0) a question heard – the talk with the assistant (the web's SpeechRecognition)
  local_auth: ^3.0.2 # (3.27.0) the app lock: the phone's fingerprint / face / PIN (Android BiometricPrompt, Face ID, Windows Hello)
  flutter_webrtc: ^1.6.2+hotfix.4 # (3.26.0) calls with the web: Google's WebRTC (the same as in Chrome) – voice, cameras, the phone's screen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_bg.png # (3.40.0) the icon: option 1 – the navy, the white tile, the R
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons3d/
    - assets/brand/rachana_logo.png
    - assets/brand/rachana_mark.png
    - assets/brand/site_home.jpg
    - assets/brand/site_login.jpg
    - assets/splash/pqc_road.webp
    - assets/i18n/
    - assets/help/web_help.json
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik_700Bold.ttf
          weight: 700
    - family: Montserrat # (3.37.0) the start screen's title and its words (only the Latin letters – see assets/fonts/OFL-Montserrat.txt)
      fonts:
        - asset: assets/fonts/Montserrat_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat_800ExtraBold.ttf
          weight: 800
    - family: NotoDeva
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari_600SemiBold.ttf
          weight: 600
