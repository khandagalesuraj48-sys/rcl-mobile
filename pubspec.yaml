name: rcl_mobile
description: RCL ERP – the mobile app (Android and iPhone). Its own phone screens on the same servers; one sign-in through the Portal.
publish_to: none
version: 3.14.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  package_info_plus: ^8.0.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0
  flutter_inappwebview: 6.2.0-beta.3 # 6.1.5 (stable) no longer builds with this Flutter (its Android build file)
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  geolocator: ^14.0.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.15.0 # (3.1.8) the number plate read on the phone
  google_mlkit_barcode_scanning: ">=0.14.1 <0.15.0" # (3.14.0) a machinery label (QR) read on the phone – the same ML Kit as above (commons 0.11)
  flutter_local_notifications: ^19.4.0 # (3.1.8) waiting for approval / sent back
  android_alarm_manager_plus: ">=4.0.0 <6.0.0" # (3.1.8) those notifications also with the app closed (Android)
  archive: ">=3.6.0 <5.0.0" # (3.2.0) the reports as Excel files (an .xlsx is a zip)
  qr: ^3.0.2 # (3.13.0) the QR labels of the Asset Master – the same QR maker as the web's (qrcode-generator, ported)
  file_picker: ^11.0.3 # (3.11.0) (13.x needs another win32 than share_plus 12) an Excel / CSV file to import, from the phone's files

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/web_bridge.js
    - assets/icons3d/
    - assets/brand/rachana_logo.png
    - assets/brand/rachana_mark.png
    - assets/i18n/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik_700Bold.ttf
          weight: 700
    - family: NotoDeva
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari_600SemiBold.ttf
          weight: 600
