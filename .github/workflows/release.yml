# RELEASE – run by hand (Actions → release → Run workflow) on main, after the owner says yes.
# Builds the signed Android app and publishes it as a GitHub Release of this repository (asked 14-10-2026: "git release madhe
# apk theun de"): the file for the first install, and where the app's "Update" looks (lib/core/update.dart).
# (3.19.0) The same release also carries the Windows setup (RCL-ERP-Setup-<version>-<build>.exe – job "windows") and its
# fingerprint ("win"): the computer app's own update. If only the Windows part fails, the Android app is still released
# (without the setup – the computers keep their version and are told nothing).
# The signing key is made ONCE and kept only in the private bucket "app-keys" of the Portal's Supabase (Android installs an
# update only when it carries the same key – it must never change). Needs two GitHub secrets (never in a file, never in chat):
#   PORTAL_SUPABASE_URL – the Portal's Supabase address      PORTAL_SUPABASE_KEY – a secret key of that project
name: release
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What is new (shown in the app)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SB_URL: ${{ secrets.PORTAL_SUPABASE_URL }}
      SB_KEY: ${{ secrets.PORTAL_SUPABASE_KEY }}
    steps:
      - name: The two settings
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "::error::Add PORTAL_SUPABASE_URL and PORTAL_SUPABASE_KEY in GitHub → this repository → Settings → Secrets and variables → Actions."; exit 1; fi
          SB_URL="${SB_URL%/}"; echo "SB_URL=$SB_URL" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Private bucket for the signing key (made once)
        run: |
          for b in app-keys; do
            c=$(curl -sS -o /tmp/b.json -w "%{http_code}" -X POST "$SB_URL/storage/v1/bucket" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d "{\"id\":\"$b\",\"name\":\"$b\",\"public\":false}")
            if [ "$c" = "200" ]; then echo "::notice::Bucket $b made (private)."; elif grep -qiE "exist|duplicate" /tmp/b.json; then echo "bucket $b is there"; else echo "::error::Bucket $b: $c $(head -c 200 /tmp/b.json)"; exit 1; fi
          done
      - name: Signing key (made once; kept only in the private bucket app-keys)
        run: |
          set -e
          cd android
          get() { curl -sS -o "$2" -w "%{http_code}" "$SB_URL/storage/v1/object/app-keys/$1" -H "apikey: $SB_KEY"; }
          put() { curl -sS -o /tmp/put.json -w "%{http_code}" -X POST "$SB_URL/storage/v1/object/app-keys/$1" -H "apikey: $SB_KEY" -H "Content-Type: $3" -H "x-upsert: false" --data-binary "@$2"; }
          if [ "$(get upload-keystore.jks upload-keystore.jks)" = "200" ] && [ "$(get key.properties key.properties)" = "200" ]; then
            echo "the signing key is there"
          else
            rm -f upload-keystore.jks key.properties
            PW=$(openssl rand -hex 24); echo "::add-mask::$PW"
            keytool -genkeypair -keystore upload-keystore.jks -storetype PKCS12 -keyalg RSA -keysize 4096 -validity 36500 -alias rcl \
              -storepass "$PW" -keypass "$PW" -dname "CN=Rachana Construction Limited, O=RCL, C=IN" >/dev/null 2>&1
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=rcl\nstoreFile=upload-keystore.jks\n" "$PW" "$PW" > key.properties
            [ "$(put upload-keystore.jks upload-keystore.jks application/octet-stream)" = "200" ] || { echo "::error::Could not keep the signing key: $(head -c 200 /tmp/put.json)"; exit 1; }
            [ "$(put key.properties key.properties text/plain)" = "200" ] || { echo "::error::Could not keep key.properties: $(head -c 200 /tmp/put.json)"; exit 1; }
            echo "::notice::A NEW signing key was made and kept in the private bucket app-keys. Download a copy from Supabase and keep it offline."
          fi
          echo "::add-mask::$(grep '^storePassword=' key.properties | cut -d= -f2-)"
      - name: Version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BN=$((100 + GITHUB_RUN_NUMBER))
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "BN=$BN" >> "$GITHUB_ENV"
          echo "::notice::Releasing $VER ($BN)"
      - run: flutter pub get
      - name: Tests (a release only when they pass)
        run: flutter test --exclude-tags golden
      - name: Signed Android app
        # every Android phone (ARM 32 + 64 bit); the emulator part (x86_64) is left out
        run: |
          flutter build apk --release --build-name="$VER" --build-number="$BN" --target-platform android-arm,android-arm64 --split-debug-info=build/symbols
          SZ=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk); echo "::notice::App file: $((SZ / 1048576)) MB"
      - name: Check the signature (never the debug key)
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::The app is signed with the debug key – not released."; exit 1; fi
          echo "::notice::Signed by: $(grep -m1 'certificate SHA-256 digest' certs.txt)"
      - name: One place for the app – the Portal's store entry of before (14-10-2026, build 102) is taken out
        run: |
          curl -sS -o /dev/null -w "old store entry: %{http_code}\n" -X DELETE "$SB_URL/storage/v1/object/app-releases" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{"prefixes":["android/latest.json"]}' || true
      - name: The app file for the release
        run: cp build/app/outputs/flutter-apk/app-release.apk "rcl-erp-$VER-$BN.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: rcl-erp-*.apk

  # (3.19.0) the Windows app and its setup – the same version and build number as the Android app
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '\r')
          BN=$((100 + GITHUB_RUN_NUMBER))
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "BN=$BN" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Windows app
        shell: bash
        run: flutter build windows --release --build-name="$VER" --build-number="$BN"
      - name: The Visual C++ files next to the app
        shell: pwsh
        run: ./tool/windows_setup.ps1 -Step crt
      - name: The setup (Inno Setup)
        shell: pwsh
        run: ./tool/windows_setup.ps1 -Step setup -Ver $env:VER -Build $env:BN
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: build/installer/*.exe

  publish:
    needs: [android, windows]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BN=$((100 + GITHUB_RUN_NUMBER))
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "BN=$BN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: setup
          path: out
      - name: GitHub Release (the app files + their fingerprints)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
          WIN_OK: ${{ needs.windows.result }}
        run: |
          set -e
          F="out/rcl-erp-$VER-$BN.apk"; W="out/RCL-ERP-Setup-$VER-$BN.exe"
          [ -f "$F" ] || { echo "::error::The Android app file is missing."; exit 1; }
          export SHA=$(sha256sum "$F" | cut -d' ' -f1) WSHA=""
          FILES=("$F"); WHAT="Android"
          if [ "$WIN_OK" = "success" ] && [ -f "$W" ]; then
            export WSHA=$(sha256sum "$W" | cut -d' ' -f1); FILES+=("$W"); WHAT="Android and Windows"
          else
            echo "::warning::The Windows setup was not made – this release is for Android only (the computers keep their version)."
          fi
          META=$(python3 -c "import json,os;m={'build':int(os.environ['BN']),'version':os.environ['VER'],'sha256':os.environ['SHA']};w=os.environ.get('WSHA','');m.update({'win':w} if w else {});print(json.dumps(m))")
          { printf "%s\n\nRCL ERP %s (%s) – %s.\nAndroid SHA-256: %s\n" "${NOTES:-RCL ERP $VER}" "$VER" "$BN" "$WHAT" "$SHA"
            [ -n "$WSHA" ] && printf "Windows SHA-256: %s\n" "$WSHA"
            printf "\n<!-- rcl:%s -->\n" "$META"; } > notes.md
          gh release create "v$VER-$BN" "${FILES[@]}" --title "RCL ERP $VER ($BN)" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "::notice::Released $VER ($BN) – $WHAT – https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VER-$BN"
