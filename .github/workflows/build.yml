# Every push: the app is checked (analyze, tests), the screens are drawn (pictures for looking at) and an Android app file
# is built. The first run also makes the android/ and ios/ folders (flutter create + tool/patch_platforms.py) and saves them
# in the branch. No secret is needed here; the signed release is release.yml.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Platform folders (first run only)
        id: plat
        run: |
          if [ ! -d android ]; then
            flutter create --org in.rachana.rcl --project-name rcl_mobile --platforms=android,ios .
            python3 tool/patch_platforms.py
            echo "made=1" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - name: App icons
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test --exclude-tags golden
      - name: Screens (pictures)
        run: flutter test --tags golden --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test/goldens/*.png
          if-no-files-found: warn
      - name: Android app (debug-signed – for checking only)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Save the platform folders in the branch
        if: steps.plat.outputs.made == '1' && github.event_name == 'push'
        run: |
          git config user.name "rcl-build"
          git config user.email "rcl-build@users.noreply.github.com"
          git add android ios .metadata pubspec.lock || true
          git commit -m "Platform folders made by the build (flutter create + tool/patch_platforms.py)" || exit 0
          git push
