# Every push: the app is checked (analyze, tests), the screens are drawn and an Android app file is built; (3.19.0) the Windows
# app and its setup are built (job "windows", file "windows-setup") and the iPhone app is built without signing (job "ios" – the
# check that it builds; signing and TestFlight need the Apple Developer account).
# The first run also makes the android/ and ios/ folders (flutter create + tool/patch_platforms.py) and saves them in the branch;
# (3.19.0) the windows/ folder the same way (flutter create --platforms=windows + tool/patch_platforms.py --windows).
# What went wrong is written as annotations (readable through the GitHub API); the screen pictures are saved in the branch
# "screens/<branch>". No secret is needed here; the signed release is release.yml.
name: build
on:
  push:
    branches-ignore: ['screens/**', 'screens-win/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: |
          flutter --version | tee fv.txt
          echo "::notice::$(head -1 fv.txt) / $(grep -o 'Dart [0-9.]*' fv.txt)"
      - name: Platform folders (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --org in.rachana.rcl --project-name rcl_mobile --platforms=android,ios .
            python3 tool/patch_platforms.py
            flutter pub get
            dart run flutter_launcher_icons
            if [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "rcl-build"; git config user.email "rcl-build@users.noreply.github.com"
              git add android ios .metadata pubspec.lock
              git commit -m "Platform folders made by the build (flutter create + tool/patch_platforms.py + icons)" && git push
            fi
          fi
      - name: Windows folder (first run only – flutter create + tool/patch_platforms.py --windows; the app's icon and setup are in git)
        run: |
          if [ ! -f windows/runner/main.cpp ]; then
            rm -rf /tmp/wgen && flutter create --org in.rachana.rcl --project-name rcl_mobile --platforms=windows --no-pub /tmp/wgen
            mkdir -p windows && cp -rn /tmp/wgen/windows/. windows/
            python3 tool/patch_platforms.py --windows
            flutter pub get
            if [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "rcl-build"; git config user.email "rcl-build@users.noreply.github.com"
              git add windows && git commit -m "Windows folder made by the build (flutter create + tool/patch_platforms.py --windows)" && git push
            fi
          fi
      - name: Company logo (first run only – the same picture the web ERP shows)
        if: github.event_name == 'push'
        run: |
          if [ ! -f assets/brand/rachana_src.png ]; then
            mkdir -p assets/brand
            curl -fsSL --max-time 60 https://i.ibb.co/CpSfBqXX/RCL-LOGO-PDF.png -o assets/brand/rachana_src.png || { echo "::warning::the logo could not be downloaded"; exit 0; }
            git config user.name "rcl-build"; git config user.email "rcl-build@users.noreply.github.com"
            git add assets/brand/rachana_src.png && git commit -m "The company logo (from the web ERP's address)" && git pull --rebase -q && git push
          fi
      - name: Packages
        run: |
          set +e
          flutter pub get > pub.txt 2>&1; st=$?
          cat pub.txt
          if [ $st -ne 0 ]; then msg=$(grep -vE "^\s*$" pub.txt | tail -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'); echo "::error title=pub get::$msg"; fi
          exit $st
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1; st=$?
          cat analyze.txt
          grep -E "^\s*(error|warning) •" analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $st
      - name: Tests
        run: |
          set +e
          flutter test --exclude-tags golden --reporter expanded > test.txt 2>&1; st=$?
          cat test.txt
          if [ $st -ne 0 ]; then
            for part in 1 2 3 4; do
              msg=$(grep -vE "^\s*$" test.txt | grep -iE -B2 -A14 "FAILED|Error:|Expected:|error •|══╡" | sed -n "$(( (part-1)*45+1 )),$(( part*45 ))p" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
              [ -n "$msg" ] && echo "::error title=tests part $part::$msg"
            done
          fi
          exit $st
      - name: Screens (pictures)
        run: |
          set +e
          flutter test --tags golden --update-goldens --reporter expanded > shots.txt 2>&1; st=$?
          cat shots.txt
          if [ $st -ne 0 ]; then
            awk '/EXCEPTION CAUGHT/{n=14} n>0{print; n--; next} /Expected:|Actual:|Which:|\[E\]|file:\/\/\/.*\/lib\//{print}' shots.txt | grep -v "◢◤" | awk '!seen[$0]++' > shots_short.txt
            for part in 1 2 3; do
              msg=$(sed -n "$(( (part-1)*40+1 )),$(( part*40 ))p" shots_short.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
              [ -n "$msg" ] && echo "::error title=screens part $part::$msg"
            done
          fi
          exit $st
      - name: Save the screen pictures in screens/<branch>
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls test/goldens/*.png >/dev/null 2>&1 || exit 0
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cp test/goldens/*.png /tmp/shots/ && cd /tmp/shots
          git init -q && git config user.name "rcl-build" && git config user.email "rcl-build@users.noreply.github.com"
          git add . && git commit -qm "Screens of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/screens/${GITHUB_REF_NAME}"
      - name: Android app (debug-signed – for checking only)
        run: |
          flutter build apk --release 2>&1 | tee apk.txt; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then msg=$(grep -iE -B3 -A10 "error|FAILURE|What went wrong" apk.txt | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'); echo "::error title=apk::$msg"; fi
          exit $st
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: The sizes – the file for every phone, and one processor's file (3.19.1 – what a 64-bit phone's update downloads)
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-release.apk all.apk
          RCL_ABIS=arm64-v8a flutter build apk --release --target-platform android-arm64 > a64.txt 2>&1 || { tail -40 a64.txt; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk a64.apk
          abis() { unzip -l "$1" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//'; }
          for f in all.apk a64.apk; do echo "::notice::$f: $(( $(stat -c %s $f) / 1048576 )) MB – processors: $(abis $f)"; done
          [ "$(abis all.apk)" = "arm64-v8a armeabi-v7a" ] || { echo "::error::the file for every phone has: $(abis all.apk)"; exit 1; }
          [ "$(abis a64.apk)" = "arm64-v8a" ] || { echo "::error::the 64-bit file has: $(abis a64.apk)"; exit 1; }

  # (3.19.0) THE WINDOWS APP: built on Windows, the Visual C++ files put next to it, its setup made (windows/installer.iss)
  windows:
    # (3.37.0, asked 25-10-2026: "app fkt android ios sathi asel window sathi app banwaychi nahi") no Windows app any more
    if: false
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Windows folder (until the build has saved it in the branch)
        shell: bash
        run: |
          if [ ! -f windows/runner/main.cpp ]; then
            flutter create --org in.rachana.rcl --project-name rcl_mobile --platforms=windows --no-pub "$RUNNER_TEMP/wgen"
            mkdir -p windows && cp -rn "$RUNNER_TEMP/wgen/windows/." windows/
            python tool/patch_platforms.py --windows
          fi
      - run: flutter pub get
      - name: Windows app
        shell: bash
        run: |
          set +e
          flutter build windows --release 2>&1 | tee win.txt; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then msg=$(grep -iE -B4 -A8 "error|failed" win.txt | head -90 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'); echo "::error title=windows::$msg"; fi
          exit $st
      - name: The Visual C++ files next to the app (a computer without them still opens it)
        shell: pwsh
        run: ./tool/windows_setup.ps1 -Step crt
      - name: The setup (Inno Setup)
        shell: pwsh
        run: ./tool/windows_setup.ps1 -Step setup
      - name: The setup tried on Windows - installed, the app open, then the app's own update (pictures in screens-win/<branch>)
        shell: pwsh
        run: ./tool/windows_setup.ps1 -Step smoke -Out "$env:RUNNER_TEMP\shots"
      - name: Save the pictures in screens-win/<branch>
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/shots" 2>/dev/null && ls *.png >/dev/null 2>&1 || exit 0
          git init -q && git config user.name "rcl-build" && git config user.email "rcl-build@users.noreply.github.com"
          git add . && git commit -qm "Windows pictures of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/screens-win/${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/installer/*.exe

  # (3.19.0) THE IPHONE APP: built without signing – the check that it builds (signing and TestFlight: the Apple account)
  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iPhone app (not signed)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee ios.txt; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then msg=$(grep -iE -B4 -A10 "error|failed" ios.txt | head -90 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'); echo "::error title=ios::$msg"; fi
          exit $st
