# PLAY – the file for the Google Play Store (3.165.0, asked 21-11-2026: "apan play store war developer account banwalell aahe …
# first app deychi aahe"). Started by hand: Actions → play → Run workflow (the branch whose code goes to the store – main or beta).
# It makes ONE signed bundle (.aab) of the Play Store's app:
#   – the package si.sketchline.lion, the name Sketchline Lion (android/app/src/play/AndroidManifest.xml, RCL_STORE=play);
#   – no update of its own: Google Play updates it (lib/core/play_update.dart, --dart-define=PLAY=true);
#   – signed with the Play Store's own UPLOAD key, in the name of Sketchline Industries (made once here, kept only in the
#     private bucket app-keys – never in a file); Google makes and keeps the app's real signing key;
#   – its number (version code) is 100000 + this workflow's run number: always higher than the one before, as Play asks.
# The bundle is kept with the run for 14 days (Artifacts → play-bundle): he downloads it and puts it in the Play Console himself.
# Nothing is sent to Google from here and no release of this repository is made – the phones of today are not touched.
# (27-11-2026, his words: "ata play version peksha apan khup pudhe gelo aahot … aaj lagech prt ekda play store war new updet aab file
# deu jene krun apk and play store same astil"; with his permanent rule of 25-11-2026: the app's updates without the store, for the
# Play Store's app too) the bundle is made and RELEASED BY SHOREBIRD: the release "<version>+<100000 + run>" in Shorebird, so a later
# fix of the Dart code reaches the Play Store's phones as a patch too (patch.yml, "Which app": play / both) – the same patch-signing
# key as the app given by its file. Google Play still gives a new bundle when the native part changes.
# The same GitHub secrets as beta.yml / release.yml, and SHOREBIRD_TOKEN.
name: play
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play
  cancel-in-progress: false
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SB_URL: ${{ secrets.PORTAL_SUPABASE_URL }}
      SB_KEY: ${{ secrets.PORTAL_SUPABASE_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      FALCON_SUPABASE_URL: ${{ vars.FALCON_SUPABASE_URL || secrets.FALCON_SUPABASE_URL }}   # (3.171.0) FALCON inside the app (tool/falcon_defines.sh)
      FALCON_SUPABASE_KEY: ${{ vars.FALCON_SUPABASE_KEY || secrets.FALCON_SUPABASE_KEY }}
      FALCON_SERVER: ${{ vars.FALCON_SERVER || secrets.FALCON_SERVER }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      RCL_STORE: play
    steps:
      - uses: actions/checkout@v5
      - name: The version and its number
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BN=$(( 100000 + GITHUB_RUN_NUMBER ))
          { echo "VER=$VER"; echo "BN=$BN"; } >> "$GITHUB_ENV"
          echo "::notice::Play Store: Sketchline Lion $VER ($BN) of $GITHUB_REF_NAME"
      - name: The two settings
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "::error::Add PORTAL_SUPABASE_URL and PORTAL_SUPABASE_KEY in GitHub → this repository → Settings → Secrets and variables → Actions."; exit 1; fi
          SB_URL="${SB_URL%/}"; echo "SB_URL=$SB_URL" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # (21-11-2026, his word: "sketchline name haw aahe") THE PLAY STORE'S OWN UPLOAD KEY – in the name of Sketchline Industries. Made
      # ONCE here (a random secret word nobody sees), kept only in the private bucket app-keys beside the key of the app given by its
      # file, and never made again while it is there (x-upsert: false – it is never written over). Google keeps the app's real signing
      # key; this one only signs what is sent to Google, and Google can replace it on request if it is ever lost.
      - name: Upload key of the Play Store's app (made once; kept only in the private bucket app-keys)
        run: |
          set -e
          cd android
          get() { curl -sS --max-time 60 -o "$2" -w "%{http_code}" "$SB_URL/storage/v1/object/app-keys/$1" -H "apikey: $SB_KEY"; }
          put() { curl -sS --max-time 60 -o /tmp/put.json -w "%{http_code}" -X POST "$SB_URL/storage/v1/object/app-keys/$1" -H "apikey: $SB_KEY" -H "Content-Type: $3" -H "x-upsert: false" --data-binary "@$2"; }
          if [ "$(get play-upload-keystore.jks play-upload-keystore.jks)" = "200" ] && [ "$(get play-key.properties key.properties)" = "200" ]; then
            echo "the Play Store's upload key is there"
          else
            rm -f play-upload-keystore.jks key.properties
            PW=$(openssl rand -hex 24); echo "::add-mask::$PW"
            keytool -genkeypair -keystore play-upload-keystore.jks -storetype PKCS12 -keyalg RSA -keysize 4096 -validity 36500 -alias lion \
              -storepass "$PW" -keypass "$PW" -dname "CN=Sketchline Industries, O=Sketchline, C=IN" >/dev/null 2>&1
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=lion\nstoreFile=play-upload-keystore.jks\n" "$PW" "$PW" > key.properties
            [ "$(put play-upload-keystore.jks play-upload-keystore.jks application/octet-stream)" = "200" ] || { echo "::error::Could not keep the Play upload key: $(head -c 200 /tmp/put.json)"; exit 1; }
            [ "$(put play-key.properties key.properties text/plain)" = "200" ] || { echo "::error::Could not keep play-key.properties: $(head -c 200 /tmp/put.json)"; exit 1; }
            echo "::notice::A NEW upload key for the Play Store (Sketchline Industries) was made and kept in the private bucket app-keys."
          fi
          echo "::add-mask::$(grep '^storePassword=' key.properties | cut -d= -f2-)"
          [ "$(grep '^storeFile=' key.properties | cut -d= -f2-)" = "play-upload-keystore.jks" ] || { echo "::error::play-key.properties does not name the Play upload key"; exit 1; }
      - name: Firebase settings – the file must know the Play Store's package
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::error::Add GOOGLE_SERVICES_JSON in GitHub → this repository → Settings → Secrets and variables → Actions."; exit 1; fi
          printf '%s' "$GSJ" > android/app/google-services.json
          python3 - <<'PY'
          import json, sys
          j = json.load(open('android/app/google-services.json'))
          names = [c.get('client_info', {}).get('android_client_info', {}).get('package_name', '') for c in j.get('client', [])]
          if 'si.sketchline.lion' not in names:
              print('::error::Firebase does not know the app si.sketchline.lion yet. Firebase → Project settings → Add app → Android → package si.sketchline.lion → download google-services.json → put the whole file in the GitHub secret GOOGLE_SERVICES_JSON (it keeps the app of today too). It has: %s' % names); sys.exit(1)
          PY
      - run: flutter pub get
      - name: Tests (a bundle only when they pass)
        run: flutter test --exclude-tags golden
      - name: Room for the Android build (swap, free disk)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo fallocate -l 8G /rcl-swap && sudo chmod 600 /rcl-swap && sudo mkswap /rcl-swap >/dev/null && sudo swapon /rcl-swap || true
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      # (27-11-2026) the patch-signing key of the app given by its file (only its PUBLIC part goes into the bundle)
      - name: Shorebird – its key and the patch-signing key
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then echo "::error::Add SHOREBIRD_TOKEN (Shorebird → Settings → Service accounts → lion-github-build → API keys) in GitHub → this repository → Settings → Secrets and variables → Actions."; exit 1; fi
          bash tool/shorebird_keys.sh "$RUNNER_TEMP/sbkeys"
      - name: Signed bundle for the Play Store (released by Shorebird)
        run: |
          set -e
          GM=""; [ -n "$MAPS_API_KEY" ] && GM="--dart-define=GMAPS=true"
          FD=$(bash tool/falcon_defines.sh) || exit 1; GM="$GM $FD"   # (3.171.0) FALCON inside the app
          # (27-11-2026) a patch of this release must be built the SAME way: RCL_STORE=play, PLAY=true, the same defines (patch.yml)
          shorebird release android --artifact aab --no-confirm --build-name="$VER" --build-number="$BN" --split-debug-info=build/symbols --public-key-path="$RUNNER_TEMP/sbkeys/patch-public.pem" --dart-define=PLAY=true $GM
          rm -rf "$RUNNER_TEMP/sbkeys"
          cp build/app/outputs/bundle/release/app-release.aab "lion-$VER-$BN.aab"
          echo "::notice::Shorebird release $VER+$BN (the Play Store's app) – its patches: Actions → patch → \"Which app\": play or both"
          # never the debug key: the bundle's signer must be the app's own key
          OWNER=$(keytool -printcert -jarfile "lion-$VER-$BN.aab" | grep -m1 '^Owner:' || true)
          echo "::notice::signed by: $OWNER"
          case "$OWNER" in *"CN=Sketchline Industries"*) ;; *) echo "::error::the bundle is not signed with the Play Store's upload key (Sketchline Industries)"; exit 1;; esac
          echo "::notice::lion-$VER-$BN.aab – $(( $(stat -c %s lion-$VER-$BN.aab) / 1048576 )) MB"
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: lion-*.aab
          retention-days: 14
      # the symbol files of this release, 90 days (the lines of a fault the app reports can be read with them)
      - uses: actions/upload-artifact@v4
        with:
          name: play-symbols
          path: build/symbols
          if-no-files-found: ignore
          retention-days: 90
